services:
  ferretdb:
    image: debian:bookworm-slim
    restart: unless-stopped
    environment:
      DO_NOT_TRACK: "1"
      FERRETDB_TELEMETRY: disable
      FERRETDB_RELEASE: ${FERRETDB_RELEASE:-download/v1.54.0}
    command:
      - sh
      - -c
      - |
        set -eu
        binary=/data/bin/ferretdb
        if [ ! -x "$$binary" ]; then
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
          architecture="$$(dpkg --print-architecture)"
          case "$$architecture" in ppc64el) architecture=ppc64le ;; esac
          mkdir -p /data/bin
          curl -fSL --retry 5 -o "$$binary" \
            "https://github.com/wekan/FerretDB/releases/$${FERRETDB_RELEASE}/ferretdb-$${architecture}"
          chmod +x "$$binary"
        fi
        mkdir -p /data/files/db
        exec "$$binary" \
          --handler=sqlite \
          --sqlite-url=file:/data/files/db/ \
          --listen-addr=0.0.0.0:27017 \
          --repl-set-name=rs0 \
          --telemetry=disable \
          --log-level=error
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/27017' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    volumes:
      - ferretdb-data:/data

  wekan:
    image: ghcr.io/wekan/wekan:v6.89
    restart: unless-stopped
    depends_on:
      ferretdb:
        condition: service_healthy
    ports:
      - 127.0.0.1:${WEKAN_PORT:-3000}:8080
    environment:
      MONGO_URL: mongodb://ferretdb:27017/wekan?directConnection=true
      ROOT_URL: ${WEKAN_ROOT_URL:-http://localhost:3000}
      WITH_API: "true"
      WRITABLE_PATH: /data
      DEFAULT_METEOR_REACTIVITY_ORDER: polling
      METEOR_REACTIVITY_ORDER: polling
      DDP_TRANSPORT: sockjs
    volumes:
      - wekan-files:/data

  wekan-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [mcp]
    restart: "no"
    stdin_open: true
    tty: false
    env_file:
      - .env
    environment:
      WEKAN_BASE_URL: http://wekan:8080
    depends_on:
      wekan:
        condition: service_started

volumes:
  ferretdb-data:
  wekan-files:
